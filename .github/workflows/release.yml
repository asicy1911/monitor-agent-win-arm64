name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Also publish a GitHub Release (run on a matching v* tag)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-24.04
            target: x86_64-pc-windows-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -C target-feature=+crt-static
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check release version
        env:
          PUBLISH: ${{ inputs.publish || startsWith(github.ref, 'refs/tags/') }}
        run: python tools/package.py --check-version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: python tools/package.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: monitor-agent-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish == true
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: monitor-agent-*
          path: dist
          merge-multiple: true
      - name: Publish release with checksums
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum monitor-agent-* > sha256sums.txt
          gh release create "$RELEASE_TAG" ./* --verify-tag --generate-notes
