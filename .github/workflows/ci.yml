name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      bundle_artifact:
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            native: true
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            native: true
          - runner: ubuntu-24.04
            target: x86_64-pc-windows-gnu
            native: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -C target-feature=+crt-static
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - if: inputs.bundle_artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.bundle_artifact }}
          path: ${{ runner.temp }}/upstream-candidate
      - if: inputs.bundle_artifact != ''
        name: Check out the exact upstream candidate
        run: |
          git fetch "$RUNNER_TEMP/upstream-candidate/candidate.bundle" HEAD
          git checkout --detach FETCH_HEAD
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - if: runner.os == 'Linux'
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - run: cargo fmt --all --check
      - run: cargo check --locked --target ${{ matrix.target }}
      - run: cargo clippy --locked --target ${{ matrix.target }} --all-targets -- -D warnings
      - if: matrix.native
        run: cargo test --locked --target ${{ matrix.target }}
      - if: matrix.native
        run: cargo build --locked --target ${{ matrix.target }}
      - if: matrix.native
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - if: matrix.native
        run: python -m pip install -r tools/requirements-ci.txt
      - if: matrix.native
        name: Verify live metrics, TCP probes, and reconnection
        run: python tools/smoke_test.py target/${{ matrix.target }}/debug/monitor-agent.exe --arch ${{ matrix.target }}
      - if: matrix.native
        name: Verify Windows service installation and upgrade
        shell: pwsh
        run: ./tools/service-smoke.ps1 -AgentPath ./target/${{ matrix.target }}/debug/monitor-agent.exe
